[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "original-media-library"
version = "1.0.0"
description = "Windows-local Douyin downloader and media library"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "playwright>=1.52,<2",
  "send2trash>=1.8,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "watchdog>=6,<7",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = ["downloader", "parser"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

