name: Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    tags:
      - 'android-v*'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install native build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y autoconf automake libtool pkg-config nasm yasm gperf groff gettext texinfo bison flex
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653" "emulator" "platform-tools"
      - uses: actions/cache@v4
        with:
          path: android/.native-build
          key: ffmpeg-kit-v6.0-gpl-lame-api24-ndk25-${{ runner.os }}-${{ hashFiles('android/scripts/build-ffmpeg.sh') }}
      - name: Build local FFmpegKit AAR
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/25.2.9519653"
          bash scripts/build-ffmpeg.sh
      - name: Configure optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > media-downloader-release.jks
            printf 'storeFile=media-downloader-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
          fi
      - run: chmod +x gradlew
      - run: ./gradlew lint test assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: media-downloader-android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/android-v')
        run: |
          cd app/build/outputs/apk/release
          sha256sum MediaDownloader-Android-1.0.0.apk > MediaDownloader-Android-1.0.0.apk.sha256
      - name: Publish Android release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Android 素材下载器 ${{ github.ref_name }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/release/MediaDownloader-Android-1.0.0.apk
            android/app/build/outputs/apk/release/MediaDownloader-Android-1.0.0.apk.sha256
            PRIVACY-ANDROID.md
            THIRD_PARTY_NOTICES.md
      - name: Remove signing files
        if: always()
        run: rm -f media-downloader-release.jks keystore.properties
