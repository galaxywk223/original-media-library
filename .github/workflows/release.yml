name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ffmpeg
      - run: npm test
      - run: npm run dist
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/MediaDownloader-Setup-*.exe
            release/MediaDownloader-Setup-*.exe.blockmap
            release/latest.yml
