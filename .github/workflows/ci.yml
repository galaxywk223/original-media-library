name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:ffmpeg
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist
      - name: Verify packaged application
        shell: pwsh
        run: |
          $env:ORIGINAL_MEDIA_LIBRARY_DATA_DIR = Join-Path $env:RUNNER_TEMP 'oml-data'
          $env:ORIGINAL_MEDIA_LIBRARY_DOWNLOAD_DIR = Join-Path $env:RUNNER_TEMP 'oml-downloads'
          $process = Start-Process -FilePath '.\release\win-unpacked\素材下载器.exe' -ArgumentList '--self-test' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged self-test failed with exit code $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/MediaDownloader-Setup-*.exe
            release/MediaDownloader-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

  desktop-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run --auto-servernum npm run test:e2e
